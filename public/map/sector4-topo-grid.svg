<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <pattern id="utmGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="0" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#utmGrid)"/>

  <!-- Tactical Grid Coordinate Ticks -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#0284C7" opacity="0.7">
    <!-- Horizontal UTM Marks -->
    <text x="10" y="15">43Q 78°28'00"E // 17°22'30"N</text>
    <text x="210" y="15">78°29'00"E</text>
    <text x="410" y="15">78°30'00"E</text>
    <text x="610" y="15">78°31'00"E</text>
    <text x="810" y="15">78°32'00"E</text>
    <text x="1010" y="15">78°33'00"E</text>

    <!-- Vertical UTM Marks -->
    <text x="5" y="105">17°22'00"N</text>
    <text x="5" y="205">17°21'30"N</text>
    <text x="5" y="305">17°21'00"N</text>
    <text x="5" y="405">17°20'30"N</text>
    <text x="5" y="505">17°20'00"N</text>
    <text x="5" y="605">17°19'30"N</text>
    <text x="5" y="705">17°19'00"N</text>
  </g>
</svg>
