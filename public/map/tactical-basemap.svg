<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Grid & Texture Patterns -->
    <pattern id="baseGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
    <pattern id="subGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0F172A" stroke-width="0.4" stroke-opacity="0.4"/>
    </pattern>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="floodZoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#BE123C" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cartographic Background -->
  <rect width="1200" height="800" fill="#060911"/>
  <rect width="1200" height="800" fill="url(#subGrid)"/>
  <rect width="1200" height="800" fill="url(#baseGrid)"/>

  <!-- Topographic Elevation Contours (Basin Elevation Polygons) -->
  <g id="elevation-contours" opacity="0.4">
    <path d="M 100,50 Q 300,120 600,80 T 1100,110 L 1150,250 Q 850,280 500,220 T 50,180 Z" fill="#0F1F38" stroke="#1E3A8A" stroke-width="1"/>
    <path d="M 120,680 Q 400,600 750,650 T 1150,620 L 1180,750 Q 700,780 300,740 T 80,780 Z" fill="#0F1F38" stroke="#1E3A8A" stroke-width="1"/>
    <path d="M 200,100 Q 500,150 800,120 T 1050,160" fill="none" stroke="#2563EB" stroke-width="0.8" stroke-dasharray="4 4"/>
    <path d="M 150,640 Q 550,570 850,620 T 1100,580" fill="none" stroke="#2563EB" stroke-width="0.8" stroke-dasharray="4 4"/>
  </g>

  <!-- Road & Transit Arterials (Major Corridors) -->
  <g id="transport-corridors">
    <!-- Ring Expressway Corridor -->
    <path d="M 50,200 C 350,150 800,180 1150,220" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M 50,200 C 350,150 800,180 1150,220" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="12 6"/>
    
    <!-- North-South Relief Access Corridor -->
    <path d="M 380,50 C 400,300 360,500 420,750" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <path d="M 380,50 C 400,300 360,500 420,750" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- East-West Flyover Highway -->
    <path d="M 80,580 C 450,520 750,540 1120,500" fill="none" stroke="#334155" stroke-width="6"/>
    <path d="M 80,580 C 450,520 750,540 1120,500" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="10 4"/>

    <!-- Secondary Field Access Lanes -->
    <line x1="220" y1="200" x2="280" y2="400" stroke="#1E293B" stroke-width="3"/>
    <line x1="580" y1="180" x2="620" y2="360" stroke="#1E293B" stroke-width="3"/>
    <line x1="880" y1="200" x2="850" y2="370" stroke="#1E293B" stroke-width="3"/>
    <line x1="420" y1="520" x2="520" y2="650" stroke="#1E293B" stroke-width="3"/>
    <line x1="720" y1="530" x2="800" y2="680" stroke="#1E293B" stroke-width="3"/>
  </g>

  <!-- Musi River Drainage Basin (Primary Hydrological Feature) -->
  <g id="hydrology-channel">
    <!-- River Bed Inundation Buffer -->
    <path d="M -50,400 C 200,350 400,450 650,380 C 900,310 1050,440 1250,390"
          fill="none" stroke="#0C4A6E" stroke-width="110" stroke-linecap="round" opacity="0.4"/>
    
    <!-- River Mainstream Flow -->
    <path d="M -50,400 C 200,350 400,450 650,380 C 900,310 1050,440 1250,390"
          fill="none" stroke="url(#waterGrad)" stroke-width="45" stroke-linecap="round"/>

    <!-- Flow Direction Markers -->
    <path d="M -50,400 C 200,350 400,450 650,380 C 900,310 1050,440 1250,390"
          fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="16 12"/>
  </g>

  <!-- Flash Flood Hazard Inundation Polygons (Zone A & B) -->
  <g id="hazard-inundation-zones">
    <!-- Primary Sector 4 Low-Lying Breach Basin -->
    <polygon points="280,310 520,330 680,480 430,530 230,420"
             fill="url(#floodZoneGrad)" stroke="#F43F5E" stroke-width="2" stroke-dasharray="8 4"/>
    
    <!-- Eastern Lowland Surge Zone -->
    <polygon points="760,340 980,300 1100,460 880,510 740,430"
             fill="url(#floodZoneGrad)" stroke="#FB7185" stroke-width="1.8" stroke-dasharray="6 4"/>
  </g>

  <!-- High-Ground Evacuation Staging Zones (Green Safe Zones) -->
  <g id="safe-staging-zones">
    <circle cx="380" cy="140" r="45" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-width="2" stroke-dasharray="6 3"/>
    <circle cx="920" cy="150" r="50" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-width="2" stroke-dasharray="6 3"/>
    <circle cx="680" cy="670" r="48" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-width="2" stroke-dasharray="6 3"/>
  </g>

  <!-- Tactical Sector Boundaries & Labels -->
  <g id="tactical-sector-overlays" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">
    <!-- Sector Grid Demarcation Lines -->
    <line x1="600" y1="0" x2="600" y2="800" stroke="#334155" stroke-width="1" stroke-dasharray="10 8"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#334155" stroke-width="1" stroke-dasharray="10 8"/>

    <text x="30" y="45" fill="#38BDF8" font-size="13" font-weight="bold" letter-spacing="1">SECTOR 4A // NORTH BASIN (SAFE ELEV 512M)</text>
    <text x="630" y="45" fill="#38BDF8" font-size="13" font-weight="bold" letter-spacing="1">SECTOR 4B // EAST HILLSIDE (STAGING BASE)</text>
    <text x="30" y="775" fill="#F43F5E" font-size="13" font-weight="bold" letter-spacing="1">SECTOR 4C // SOUTH INUNDATION (CRITICAL SURGE)</text>
    <text x="630" y="775" fill="#10B981" font-size="13" font-weight="bold" letter-spacing="1">SECTOR 4D // LOGISTICS & EVACUATION CORRIDOR</text>

    <!-- Tactical Hydrology Label -->
    <text x="500" y="365" fill="#BAE6FD" font-size="12" font-weight="bold" letter-spacing="1.5">MUSI RIVER DRAINAGE CHANNEL (WATER LEVEL: +2.8M CRITICAL)</text>
  </g>

  <!-- Map Compass Rose -->
  <g id="compass-rose" transform="translate(1130, 80)">
    <circle cx="0" cy="0" r="32" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0,-24 L 6,-6 L 24,0 L 6,6 L 0,24 L -6,6 L -24,0 L -6,-6 Z" fill="#1E293B"/>
    <polygon points="0,-24 4,-6 0,-2 -4,-6" fill="#F43F5E"/>
    <polygon points="0,24 4,6 0,2 -4,6" fill="#94A3B8"/>
    <text x="-4" y="-27" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">N</text>
  </g>

  <!-- Scale Bar -->
  <g id="scale-bar" transform="translate(40, 720)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">
    <rect x="0" y="0" width="120" height="4" fill="#64748B"/>
    <rect x="0" y="0" width="60" height="4" fill="#38BDF8"/>
    <line x1="0" y1="-3" x2="0" y2="7" stroke="#94A3B8" stroke-width="1"/>
    <line x1="60" y1="-3" x2="60" y2="7" stroke="#94A3B8" stroke-width="1"/>
    <line x1="120" y1="-3" x2="120" y2="7" stroke="#94A3B8" stroke-width="1"/>
    <text x="0" y="20">0</text>
    <text x="50" y="20">500m</text>
    <text x="110" y="20">1km</text>
  </g>
</svg>
